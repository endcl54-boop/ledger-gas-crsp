name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install pinned crsp
        run: cargo install google-clasp-rs --version 0.1.2 --locked

      - name: Check toolchain
        run: |
          node --version
          rustc --version
          crsp --version

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build Apps Script bundle
        run: npm run build
